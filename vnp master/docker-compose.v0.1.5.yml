version: '3.8'

services:
  # ============================================================================
  # v0.1 SERVICES (unchanged from v0.1)
  # ============================================================================

  # Kafka (message stream)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-servers", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - vnp-network

  # ClickHouse (OLAP database)
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    environment:
      CLICKHOUSE_DB: vnp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    volumes:
      - ./clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Measurement Agent (k6 harness)
  measurement-agent:
    build:
      context: ./measurement-agent
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: vnp-measurements
      VNP_ISSUER: ${VNP_ISSUER:-did:vnp:issuer:v0.1}
      REGION: us-east-1
      NODE_ID: node-001
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - vnp-network
    restart: unless-stopped

  # Scoring Engine (Python)
  scoring-engine:
    build:
      context: ./scoring-engine
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: vnp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      VNP_ISSUER_PRIVATE_KEY: ${VNP_ISSUER_PRIVATE_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - vnp-network
    restart: unless-stopped

  # Smart Contract Anchor (Hardhat)
  contract-anchor:
    build:
      context: ./contract-anchor
      dockerfile: Dockerfile
    environment:
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      VNP_ISSUER_PRIVATE_KEY: ${VNP_ISSUER_PRIVATE_KEY}
      CONTRACT_ADDRESS: ${VNP_ANCHOR_CONTRACT_ADDRESS}
      ANCHOR_INTERVAL_MINUTES: 60
    depends_on:
      scoring-engine:
        condition: service_started
    networks:
      - vnp-network
    restart: unless-stopped

  # GraphQL API (Node.js)
  graphql-api:
    build:
      context: ./graphql-api
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: vnp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    ports:
      - "4000:4000"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/.well-known/graphql-config"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # v0.1.5 NEW SERVICES
  # ============================================================================

  # Real-Time Scoring Engine (WebSocket + SSE)
  realtime-scoring:
    build:
      context: ./realtime-scoring
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_MEASUREMENTS: vnp-measurements
      KAFKA_TOPIC_SCORES: vnp-scores
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: vnp
      PORT: 8080
      MEASUREMENT_THRESHOLD: 100
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Public API (Express.js) - v0.1.5 extended
  public-api:
    build:
      context: ./public-api
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      GRAPHQL_ENDPOINT: http://graphql-api:4000/graphql
      REALTIME_SCORING_URL: http://realtime-scoring:8080
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: vnp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-apikey}
      SMTP_PASS: ${SMTP_PASS}
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      graphql-api:
        condition: service_healthy
      realtime-scoring:
        condition: service_healthy
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dashboard (Next.js) - v0.1.5 with real-time updates
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://graphql-api:4000/graphql
      NEXT_PUBLIC_REALTIME_SCORING_URL: ws://realtime-scoring:8080
      NEXT_PUBLIC_API_URL: http://public-api:3000
      NEXT_PUBLIC_CDN_URL: ${CDN_URL:-https://cdn.vnp.io}
    ports:
      - "3001:3001"
    depends_on:
      public-api:
        condition: service_healthy
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (optional: caching for SDK + API responses)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vnp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nginx (reverse proxy, SSL termination, rate limiting)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - public-api
      - dashboard
      - graphql-api
      - realtime-scoring
    networks:
      - vnp-network
    restart: unless-stopped

networks:
  vnp-network:
    driver: bridge

volumes:
  clickhouse-data:
    driver: local

# ============================================================================
# DEPLOYMENT NOTES
# ============================================================================

# Start all services:
#   docker-compose up -d
#
# Check health:
#   docker-compose ps
#   curl http://localhost/health
#
# Logs:
#   docker-compose logs -f [service-name]
#
# Stop:
#   docker-compose down
#
# Full cleanup (removes volumes):
#   docker-compose down -v
#
# New in v0.1.5:
#   - realtime-scoring: WebSocket/SSE real-time score stream
#   - public-api: Extended with badge + claim endpoints
#   - dashboard: WebSocket connection to realtime-scoring
#   - redis: Optional caching layer (used by API + SDKs)
#
# Backward compatible:
#   - All v0.1 services unchanged
#   - Same environment variables
#   - Same port mappings (core services)
#   - Kafka topic structure unchanged
