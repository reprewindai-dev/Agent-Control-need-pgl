name: VNP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run tests every 6 hours (catch regressions)
    - cron: '0 */6 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # PHASE 1: LINT & SECURITY SCAN
  # ============================================================================

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck (Bash)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Run Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./measurement-agent/Dockerfile
          dockerfile: ./scoring-engine/Dockerfile
          dockerfile: ./public-api/Dockerfile
          dockerfile: ./dashboard/Dockerfile

      - name: Run ESLint (JavaScript)
        run: |
          npm ci
          npm run lint:js 2>/dev/null || echo "No JS linting configured"

      - name: Run Pylint (Python)
        run: |
          pip install pylint
          pylint scoring-engine/src/ || true

      - name: Run Solidity Linter
        run: |
          npm install -g solhint
          solhint 'chain-anchoring/contracts/**/*.sol' || true

  # ============================================================================
  # PHASE 2: SECURITY & DEPENDENCY SCAN
  # ============================================================================

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

      - name: Dependency check (npm)
        run: |
          npm audit --audit-level=moderate || exit 1

      - name: Dependency check (Python)
        run: |
          pip install safety
          safety check --json || true

  # ============================================================================
  # PHASE 3: UNIT TESTS
  # ============================================================================

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['20.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          pip install -r scoring-engine/requirements.txt
          pip install pytest pytest-cov

      - name: Run Python unit tests
        run: |
          cd scoring-engine
          pytest tests/unit/ -v --cov=src --cov-report=xml
          cd ..

      - name: Upload Python coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./scoring-engine/coverage.xml
          flags: python-unit

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: |
          npm run test:unit 2>/dev/null || echo "No JS unit tests configured"

      - name: Run Solidity unit tests (Hardhat)
        run: |
          cd chain-anchoring
          npm ci
          npx hardhat test
          cd ..

  # ============================================================================
  # PHASE 4: INTEGRATION TESTS (LOCAL)
  # ============================================================================

  test-integration:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        options: >-
          --health-cmd "echo stat | nc localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:latest
        options: >-
          --health-cmd "curl -f http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r scoring-engine/requirements.txt
          pip install pytest

      - name: Run end-to-end tests
        run: |
          cd scoring-engine
          pytest tests/integration/ -v --timeout=60
          cd ..
        env:
          KAFKA_BROKERS: kafka:9092
          CLICKHOUSE_HOST: clickhouse
          CLICKHOUSE_PORT: 9000

  # ============================================================================
  # PHASE 5: BUILD DOCKER IMAGES
  # ============================================================================

  build:
    needs: [lint, security, test-unit, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-measurement-agent: ${{ steps.image.outputs.measurement-agent }}
      image-scoring-engine: ${{ steps.image.outputs.scoring-engine }}
      image-public-api: ${{ steps.image.outputs.public-api }}
      image-dashboard: ${{ steps.image.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push measurement-agent
        uses: docker/build-push-action@v4
        with:
          context: ./measurement-agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/measurement-agent:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/measurement-agent:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/measurement-agent:buildcache,mode=max

      - name: Build and push scoring-engine
        uses: docker/build-push-action@v4
        with:
          context: ./scoring-engine
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-engine:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-engine:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-engine:buildcache,mode=max

      - name: Build and push public-api
        uses: docker/build-push-action@v4
        with:
          context: ./public-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-api:buildcache,mode=max

      - name: Build and push dashboard
        uses: docker/build-push-action@v4
        with:
          context: ./dashboard
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:buildcache,mode=max

  # ============================================================================
  # PHASE 6: DEPLOY TO STAGING (on main branch only)
  # ============================================================================

  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-vnp.io
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Update image tags in deployment manifests
          sed -i 's|IMAGE_MEASUREMENT_AGENT|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/measurement-agent:${{ github.sha }}|g' k8s/staging/deployment.yaml
          sed -i 's|IMAGE_SCORING_ENGINE|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-engine:${{ github.sha }}|g' k8s/staging/deployment.yaml
          sed -i 's|IMAGE_PUBLIC_API|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-api:${{ github.sha }}|g' k8s/staging/deployment.yaml
          sed -i 's|IMAGE_DASHBOARD|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:${{ github.sha }}|g' k8s/staging/deployment.yaml
          
          # Apply manifests
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/vnp-staging -n staging --timeout=5m

      - name: Run smoke tests
        run: |
          ./scripts/smoke-tests.sh https://staging-vnp.io

      - name: Notify Slack (staging deployed)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_STAGING }}
          payload: |
            {
              "text": "✓ VNP staging deployed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*VNP Staging Deployment*\n\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

  # ============================================================================
  # PHASE 7: DEPLOY TO PRODUCTION (on main branch, manual approval)
  # ============================================================================

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vnp.io
    steps:
      - uses: actions/checkout@v4

      - name: Wait for manual approval
        run: |
          echo "⏸️ Waiting for manual approval to deploy to production..."
          echo "Review: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Deploy to production via kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Update image tags
          sed -i 's|IMAGE_MEASUREMENT_AGENT|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/measurement-agent:${{ github.sha }}|g' k8s/production/deployment.yaml
          sed -i 's|IMAGE_SCORING_ENGINE|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-engine:${{ github.sha }}|g' k8s/production/deployment.yaml
          sed -i 's|IMAGE_PUBLIC_API|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-api:${{ github.sha }}|g' k8s/production/deployment.yaml
          sed -i 's|IMAGE_DASHBOARD|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:${{ github.sha }}|g' k8s/production/deployment.yaml
          
          # Blue-green deployment
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/vnp-production -n production --timeout=10m

      - name: Run production smoke tests
        run: |
          ./scripts/smoke-tests.sh https://vnp.io
          ./scripts/production-health-check.sh

      - name: Notify Slack (production deployed)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "🚀 VNP production deployed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*VNP Production Deployment*\n\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\n\nAll systems operational."
                  }
                }
              ]
            }

  # ============================================================================
  # PHASE 8: MONITORING & ALERTS (continuous)
  # ============================================================================

  monitor:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check production health
        run: |
          # Poll production API
          curl -f https://vnp.io/health || {
            echo "Production health check failed"
            exit 1
          }

      - name: Verify on-chain anchoring
        run: |
          # Verify latest Merkle root on Base L2
          npm install -g ethers
          node scripts/verify-base-anchor.js || {
            echo "Base L2 anchor verification failed"
            exit 1
          }

      - name: Check measurement node status
        run: |
          # Verify all 5 regional measurement nodes are online
          ./scripts/check-node-status.sh

      - name: Create GitHub issue if failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production Health Check Failed - ${new Date().toISOString()}`,
              body: `Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              labels: ['production-incident', 'urgent']
            })

  # ============================================================================
  # SUCCESS: All checks passed
  # ============================================================================

  all-checks:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, security, test-unit, test-integration, build, deploy-staging]
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ] || \
             [ "${{ needs.test-unit.result }}" = "failure" ] || \
             [ "${{ needs.test-integration.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed"

      - name: Create release on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: VNP Release ${{ github.ref_name }}
          body: |
            ## VNP v0.1.0 Release
            
            ### What's New
            - Production deployment to Base L2
            - 5 global measurement regions online
            - Governance & methodology locked
            
            ### Deployment
            - All images ready in GHCR
            - Ready for Kubernetes or Docker Compose
            - Zero breaking changes
