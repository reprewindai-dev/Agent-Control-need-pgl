events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone for public endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream services matching docker-compose names and internal ports
    upstream public_api {
        server public-api:3000;
    }

    upstream graphql_api {
        server graphql-api:4000;
    }

    upstream realtime_scoring {
        server realtime-scoring:8080;
    }

    upstream dashboard_client {
        server dashboard:3001;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name localhost vnp.local vnp.io;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS gateway
    server {
        listen 443 ssl;
        server_name localhost vnp.local vnp.io;

        ssl_certificate     /etc/nginx/ssl/vnp.crt;
        ssl_certificate_key /etc/nginx/ssl/vnp.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Add modern security headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: 'unsafe-inline' 'unsafe-eval';";

        # Route / to the Next.js Dashboard Client
        location / {
            proxy_pass http://dashboard_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /graphql directly to GraphQL API
        location /graphql {
            proxy_pass http://graphql_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /v1/scores/stream (SSE + WebSockets) to Real-Time Scoring
        location /v1/scores/stream {
            proxy_pass http://realtime_scoring;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for SSE to work flawlessly
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Route other /v1 and /api routes to Public API (Express) with rate limiting
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://public_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://public_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /docs to Public API docs
        location /docs {
            proxy_pass http://public_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /health to Public API health check
        location /health {
            proxy_pass http://public_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
